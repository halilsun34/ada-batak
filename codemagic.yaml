# Codemagic CI/CD Yapılandırması - Ada Batak
# Hem Android (APK & Google Play App Bundle) hem de iOS (IPA & App Store / TestFlight) için yapılandırılmıştır.

workflows:
  # ===============================================================
  # 1. ANDROID WORKFLOW (APK & Google Play Store AAB)
  # ===============================================================
  android-workflow:
    name: Ada Batak - Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.3
      java: 17
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.batakclub.batak_club"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Bağımlılıkları Yükle
        script: |
          flutter packages pub get
      - name: Kod Analizi (Lint)
        script: |
          flutter analyze --no-fatal-infos
      - name: Birim & Widget Testlerini Çalıştır
        script: |
          flutter test
      - name: Android APK Oluştur (Universal Release)
        script: |
          flutter build apk --release --build-name=1.0.0 --build-number=$BUILD_NUMBER --android-skip-build-dependency-validation
      - name: Android App Bundle Oluştur (Google Play Store formatı)
        script: |
          flutter build appbundle --release --build-name=1.0.0 --build-number=$BUILD_NUMBER --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - halilsun34@gmail.com
        notify:
          success: true
          failure: true

  # ===============================================================
  # 2. IOS WORKFLOW (IPA & Apple App Store / TestFlight)
  # ===============================================================
  ios-release:
    name: Ada Batak - iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic_AppStore_Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Bağımlılıkları Yükle
        script: |
          flutter packages pub get
      - name: CocoaPods Podfile Kurulumu
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Kod Analizi (Lint)
        script: |
          flutter analyze --no-fatal-infos
      - name: Birim & Widget Testlerini Çalıştır
        script: |
          flutter test
      - name: Apple sertifika ve profillerini otomatik oluştur ve uygula
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.batakclub.batakClub" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:$CM_BUILD_DIR/ios/ios_distribution_key.pem \
            --issuer-id="6a7ed7d6-5947-41d2-bcde-d0be4c09750c" \
            --key-id="M3F36N5DKP" \
            --private-key=@file:$CM_BUILD_DIR/ios/AuthKey_M3F36N5DKP.p8
          keychain add-certificates
          xcode-project use-profiles
      - name: iOS (.ipa) paketini derle
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - halilsun34@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
