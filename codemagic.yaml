# Codemagic CI/CD Yapılandırması - Ada Batak
# Hem Android (APK & Google Play App Bundle) hem de iOS (IPA & App Store / TestFlight) için yapılandırılmıştır.

workflows:
  # ===============================================================
  # 1. ANDROID WORKFLOW (APK & Google Play Store AAB)
  # ===============================================================
  android-workflow:
    name: Ada Batak - Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        # Codemagic Web Arayüzünde (Environment variables) 'google_play' adında grup oluşturup
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS ekleyebilirsiniz (mağazaya otomatik yükleme için).
        - google_play
      vars:
        PACKAGE_NAME: "com.batakclub.batak_club"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Bağımlılıkları Yükle
        script: |
          flutter packages pub get
      - name: Kod Analizi (Lint)
        script: |
          flutter analyze
      - name: Birim & Widget Testlerini Çalıştır
        script: |
          flutter test
      - name: Android APK Oluştur (Universal Release)
        script: |
          flutter build apk --release --build-name=1.0.0 --build-number=$BUILD_NUMBER
      - name: Android App Bundle Oluştur (Google Play Store formatı)
        script: |
          flutter build appbundle --release --build-name=1.0.0 --build-number=$BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - halilsun34@gmail.com # Bildirim gönderilecek e-posta (isteğe bağlı)
        notify:
          success: true
          failure: true
      # İleride Google Play Console hesabınızı bağladığınızda aşağıdaki bloğu açabilirsiniz:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal # internal, alpha, beta, production
      #   submit_as_draft: true

  # ===============================================================
  # 2. IOS WORKFLOW (IPA & Apple App Store / TestFlight)
  # ===============================================================
  ios-workflow:
    name: Ada Batak - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Codemagic Web Arayüzünde 'app_store_credentials' adında grup oluşturup
        # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID ve
        # APP_STORE_CONNECT_PRIVATE_KEY ekleyebilirsiniz.
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.batakclub.batakClub"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Bağımlılıkları Yükle
        script: |
          flutter packages pub get
      - name: CocoaPods Podfile Kurulumu
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Kod Analizi (Lint)
        script: |
          flutter analyze
      - name: Birim & Widget Testlerini Çalıştır
        script: |
          flutter test
      - name: iOS IPA Oluştur (Release)
        script: |
          # İmza henüz eklenmemişse codesign olmadan IPA paketler,
          # Codemagic üzerinde Apple sertifikası yüklendiğinde otomatik imzalar.
          flutter build ipa --release --build-name=1.0.0 --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist || flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - halilsun34@gmail.com
        notify:
          success: true
          failure: true
      # İleride Apple Developer hesabınızı bağladığınızda aşağıdaki bloğu açabilirsiniz:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   submit_to_app_store: false
